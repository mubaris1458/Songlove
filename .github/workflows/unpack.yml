name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q tamil-music-github.zip
          rsync -a --exclude=.github tamilsongs-main/ ./
          rm -rf tamilsongs-main tamil-music-github.zip
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Add Tamil Music project"
          git push
