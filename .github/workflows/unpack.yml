name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q cloud.zip -d _x
          d=_x
          if [ "$(ls -A _x | wc -l)" -eq 1 ] && [ -d "_x/$(ls -A _x)" ]; then d="_x/$(ls -A _x)"; fi
          rsync -a --exclude=.github "$d"/ ./
          rm -rf _x cloud.zip
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Add Tamil Music project"
          git push
